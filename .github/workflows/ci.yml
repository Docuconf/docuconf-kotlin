name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      docuconf_go_ref:
        description: docuconf-go ref to test against (empty = .github/docuconf-go.ref)
        required: false
        default: ""
  # Nightly against docuconf-go main, to catch spec changes before a bump PR.
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@v4
      # The meta-schema the export test vets contracts against, and the conformance cases.
      - name: Pick the docuconf-go ref
        id: dcref
        env:
          EVENT: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.docuconf_go_ref }}
        run: |
          if [ "$EVENT" = schedule ]; then echo "ref=main" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_REF" ]; then echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
          else echo "ref=$(tr -d '[:space:]' < .github/docuconf-go.ref)" >> "$GITHUB_OUTPUT"; fi
      - name: Check out docuconf-go
        uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          path: docuconf-go
          ref: ${{ steps.dcref.outputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - run: go install cuelang.org/go/cmd/cue@v0.17.1
      - uses: gradle/actions/setup-gradle@v4
      # The docuconf-go-facing subset (conformance suite, cue vet of exported
      # contracts); docuconf-go's downstream workflow runs the same script.
      - name: Run scripts/conformance.sh
        run: scripts/conformance.sh
        env:
          DOCUCONF_GO_DIR: ${{ github.workspace }}/docuconf-go
      # Checks every module, the Gradle plugin and the README (ReadmeTest), then publishes the
      # -SNAPSHOT to the runner's ~/.m2 as the README's Install section describes.
      - run: |
          ./gradlew check --stacktrace
          ./gradlew publishToMavenLocal
        env:
          DOCUCONF_SPEC_DIR: ${{ github.workspace }}/docuconf-go/spec/cue
          DOCUCONF_REQUIRE_CUE: "1"
          # The shared conformance suite (SPEC §12), run through the contract-first mode.
          DOCUCONF_CONFORMANCE: ${{ github.workspace }}/docuconf-go/conformance/cases.json
          DOCUCONF_REQUIRE_CONFORMANCE: "1"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java${{ matrix.java }}
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

  # The orders example (examples/orders), built against the SDK in this repository.
  orders-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick the docuconf-go ref
        id: dcref
        env:
          EVENT: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.docuconf_go_ref }}
        run: |
          if [ "$EVENT" = schedule ]; then echo "ref=main" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_REF" ]; then echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
          else echo "ref=$(tr -d '[:space:]' < .github/docuconf-go.ref)" >> "$GITHUB_OUTPUT"; fi
      - name: Check out docuconf-go
        uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          path: docuconf-go
          ref: ${{ steps.dcref.outputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # docuconf-go's cmd/docuconf, built below for the docs check, needs Go 1.25.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - run: go install cuelang.org/go/cmd/cue@v0.17.1
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew :orders:installDist --stacktrace
      # docuconfCheck fails with a diff when the committed contract differs from a fresh export in
      # anything but metadata.generator.version, the SDK version every release PR bumps.
      - name: The committed contract matches a fresh export
        run: ./gradlew :orders:docuconfCheck
      - name: cue vet the contract against the meta-schema
        run: |
          dir="$(mktemp -d)"
          cp -r docuconf-go/spec/cue/cue.mod docuconf-go/spec/cue/contract "$dir/"
          mkdir "$dir/orders"
          cp examples/orders/contract.cue "$dir/orders/"
          cd "$dir" && cue vet -c ./orders
      - name: Install the docuconf CLI
        working-directory: docuconf-go/cmd/docuconf
        run: |
          go install .
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # CONFIG.md, CONFIG.agents.md and docs.json are generated from the committed contract.cue (release
      # PRs bump its metadata.generator.version) by the docuconf CLI of the pinned docuconf-go; they must
      # match what it writes today. These are the example README's commands, with --check.
      - name: Generated docs are up to date
        working-directory: examples/orders
        run: |
          git checkout -- contract.cue
          docuconf docs contract.cue --check CONFIG.md
          docuconf docs contract.cue --format agents --check CONFIG.agents.md
          docuconf docs contract.cue --format model --check docs.json
          docuconf vet -contract contract.cue -values deploy/values.yaml
      - name: Smoke test
        run: examples/orders/smoke.sh

  # A first-time user's project (examples/consumer): consumes docuconf from source as the README's
  # Install section says, and runs the README's steps (export, check, a bad start).
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: examples/consumer/run.sh
      # The consumer's generated docs (CONFIG.md, CONFIG.agents.md, docs.json) match what the docuconf
      # CLI of the pinned docuconf-go writes from the committed contract.cue. run.sh re-exported
      # contract.cue in place, and release PRs bump its metadata.generator.version, so restore it first.
      - name: Pick the docuconf-go ref
        id: dcref
        env:
          EVENT: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.docuconf_go_ref }}
        run: |
          if [ "$EVENT" = schedule ]; then echo "ref=main" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_REF" ]; then echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
          else echo "ref=$(tr -d '[:space:]' < .github/docuconf-go.ref)" >> "$GITHUB_OUTPUT"; fi
      - name: Check out docuconf-go
        uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          path: docuconf-go
          ref: ${{ steps.dcref.outputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - name: Install the docuconf CLI
        working-directory: docuconf-go/cmd/docuconf
        run: |
          go install .
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Generated docs are up to date
        working-directory: examples/consumer
        run: |
          git checkout -- contract.cue
          docuconf docs contract.cue --check CONFIG.md
          docuconf docs contract.cue --format agents --check CONFIG.agents.md
          docuconf docs contract.cue --format model --check docs.json
