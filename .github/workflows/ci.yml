name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@v4
      # The meta-schema the export test vets contracts against, and the conformance cases.
      - uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          path: docuconf-go
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - run: go install cuelang.org/go/cmd/cue@v0.17.1
      - uses: gradle/actions/setup-gradle@v4
      # Checks every module, the Gradle plugin and the README (ReadmeTest), then publishes the
      # -SNAPSHOT to the runner's ~/.m2 as the README's Install section describes.
      - run: |
          ./gradlew check --stacktrace
          ./gradlew publishToMavenLocal
        env:
          DOCUCONF_SPEC_DIR: ${{ github.workspace }}/docuconf-go/spec/cue
          DOCUCONF_REQUIRE_CUE: "1"
          # The shared conformance suite (SPEC §12), run through the contract-first mode.
          DOCUCONF_CONFORMANCE: ${{ github.workspace }}/docuconf-go/conformance/cases.json
          DOCUCONF_REQUIRE_CONFORMANCE: "1"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java${{ matrix.java }}
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

  # The orders example (examples/orders), built against the SDK in this repository.
  orders-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          path: docuconf-go
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - run: go install cuelang.org/go/cmd/cue@v0.17.1
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew :orders:installDist --stacktrace
      - name: The committed contract matches a fresh export
        run: |
          ./gradlew :orders:docuconfCheck
          ./gradlew :orders:docuconfExport
          git diff --exit-code -- examples/orders/contract.cue
      - name: cue vet the contract against the meta-schema
        run: |
          dir="$(mktemp -d)"
          cp -r docuconf-go/spec/cue/cue.mod docuconf-go/spec/cue/contract "$dir/"
          mkdir "$dir/orders"
          cp examples/orders/contract.cue "$dir/orders/"
          cd "$dir" && cue vet -c ./orders
      - name: Smoke test
        run: examples/orders/smoke.sh

  # A first-time user's project (examples/consumer): consumes docuconf from source as the README's
  # Install section says, and runs the README's steps (export, check, a bad start).
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: examples/consumer/run.sh
